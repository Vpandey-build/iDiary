<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iDiary</title><meta name="theme-color" content="#bdf1e9"><link rel="manifest" href="manifest.json"><style>
:root{--bg:#bdf1e9;--navy:#054560;--ink:#27394a;--line:#9db9bd;--lab:#0b5a75}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:560px;margin:auto;padding:10px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #a4d9d1;padding:8px 0 14px}h1{margin:0;font:700 1.7rem Georgia}.btn{font:inherit;font-size:.9rem;font-weight:600;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:9px 12px;cursor:pointer}.btn.out{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}.tabs{display:flex;gap:6px;border:2px solid var(--navy);border-radius:28px;overflow:auto;margin:12px 0;padding:3px}.tabs button{flex:1;border:0;background:transparent;color:var(--navy);font:inherit;font-weight:600;padding:10px;border-radius:24px;white-space:nowrap}.tabs button.active{background:var(--navy);color:white}.row{display:flex;align-items:center;gap:8px;justify-content:center;margin:14px 0}.date{font:inherit;border:2px solid var(--navy);border-radius:10px;padding:9px;background:#fff}.ar{border:0;border-radius:50%;background:var(--navy);color:#fff;width:40px;height:40px;font-size:1.5rem}.group{border-top:1px solid var(--line)}.grouphead{display:flex;align-items:center;gap:10px;padding:12px 6px;cursor:pointer}.gt{flex:1;font-size:1.08rem}.total{background:var(--navy);color:white;border-radius:20px;padding:2px 9px;font-size:.82rem}.items{padding:5px 5px 15px}.item{display:flex;align-items:center;gap:10px;margin:9px 0}.item button{background:var(--navy);color:white;border:0;border-radius:50%;width:38px;height:38px;font-size:1.35rem}.item input{width:76px;height:40px;border:2px solid #111;background:white;text-align:center;font:inherit}.item label{flex:1;color:var(--lab)}.hide{display:none}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:#fff;border-radius:12px;padding:10px}.card b{display:block;font-size:1.4rem;color:var(--navy)}.card small{font-size:.9rem}.bar{height:9px;background:#fff;border-radius:9px;overflow:hidden;margin:5px 0 12px}.bar i{display:block;height:100%;background:var(--navy)}h2{font-size:1rem;color:var(--navy);margin:18px 0 6px}.chart{height:100px;background:white;border-radius:10px;display:flex;align-items:end;gap:2px;padding:8px}.chart i{flex:1;background:var(--navy);min-height:2px}.chart i.empty{opacity:.2}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calgrid button{padding:8px 0;border:0;border-radius:7px;background:white;color:var(--ink)}.calgrid button.sel{background:var(--navy);color:white}.calgrid button.mark{box-shadow:inset 0 -3px #f6d93a}.small{font-size:.82rem;color:var(--lab)}
</style></head><body><main><header class="head"><h1>iDiary</h1><div><button class="btn out" id="backup">Backup</button> <button class="btn" id="restore">Restore</button></div></header><input id="file" type="file" accept="application/json" hidden><nav class="tabs" id="tabs"></nav><section id="virtuePane"></section><section id="trendPane" class="hide"></section><section id="calendarPane" class="hide"></section><section id="timerPane" class="hide"></section><section id="tabManage" class="hide"></section></main><script>
const KEY='idiary-data';let DATA={};try{DATA=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let today=iso(new Date()),date=today,openGroup=null,tabset=['Virtues','Insights','Calendar','Meditation'],activeTab='Virtues';const groups=[['a','Ahimsa (Non-Violence)',[['t','In Thought'],['w','In Word'],['d','In Deed']]],['t','Truthfulness',[['f','Falsehood'],['d','Deceit'],['h','Hypocrisy']]],['p','Purity',[['t','In Thought'],['w','In Word'],['d','In Deed']]],['h','Humility',[['w','Pride Of Wealth'],['k','Vanity Of Knowledge'],['p','Intoxication Of Power']]],['d','Diet',[['f','Wrong Food'],['d','Drugs'],['a','Alcohol']]],['s','Selfless Service',[['p','Physically'],['f','Financially']]],['m','Time Devoted (Minutes)',[['s','Selfless Service'],['i','Simran (Watching)'],['b','Bhajan (Sound Current)']]]];function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function save(){localStorage.setItem(KEY,JSON.stringify(DATA))}function ent(d=date){return DATA[d]||(DATA[d]={})}function total(g,e=ent()){return g[2].reduce((s,c)=>s+(+e[g[0]+'_'+c[0]]||0),0)}function get(id){return groups.find(g=>g[0]===id)}function set(k,v){let g=get(k.split('_')[0]);v=Math.min(g[0]==='m'?1440:999,Math.max(0,+v||0));ent()[k]=v;save();renderVirtues()}
function renderTabs(){let t=document.querySelector('#tabs');t.innerHTML=tabset.map(n=>`<button class="${activeTab===n?'active':''}" data-tab="${esc(n)}">${esc(n)}</button>`).join('')+`<button title="Manage tabs" data-tab="⚙">⚙</button>`;t.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='⚙'){activeTab='Manage';show()}else{activeTab=b.dataset.tab;show()}})}function show(){renderTabs();['virtuePane','trendPane','calendarPane','timerPane','tabManage'].forEach(x=>document.getElementById(x).classList.add('hide'));let map={'Virtues':'virtuePane','Insights':'trendPane','Calendar':'calendarPane','Meditation':'timerPane','Manage':'tabManage'};document.getElementById(map[activeTab]||'virtuePane').classList.remove('hide');if(activeTab==='Virtues')renderVirtues();if(activeTab==='Insights')renderTrends();if(activeTab==='Calendar')renderCalendar();if(activeTab==='Meditation')renderTimer();if(activeTab==='Manage')renderManage()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderVirtues(){let p=document.querySelector('#virtuePane');p.innerHTML=`<div class="row"><button class="ar" id="prev">‹</button><input class="date" type="date" value="${date}" max="${today}" id="pick"><button class="ar" id="next" ${date>=today?'disabled':''}>›</button></div><p class="small">Auto-save enabled · <button class="btn out" id="csv">Export month CSV</button></p>`+groups.map(g=>`<div class="group"><div class="grouphead" data-group="${g[0]}"><span class="gt">${g[1]}</span><span class="total">${total(g)||''}</span><span>${openGroup===g[0]?'⌄':'›'}</span></div>${openGroup===g[0]?`<div class="items">${g[2].map(c=>{let k=g[0]+'_'+c[0];return `<div class="item"><button data-change="-1" data-k="${k}">−</button><input data-val="${k}" inputmode="numeric" value="${ent()[k]||0}"><button data-change="1" data-k="${k}">+</button><label>${c[1]}</label></div>`}).join('')}</div>`:''}</div>`).join('');p.querySelector('#prev').onclick=()=>shift(-1);p.querySelector('#next').onclick=()=>shift(1);p.querySelector('#pick').onchange=e=>{date=e.target.value||today;renderVirtues()};p.querySelector('#csv').onclick=()=>exportCSV(date.slice(0,7));p.querySelectorAll('[data-group]').forEach(x=>x.onclick=()=>{openGroup=openGroup===x.dataset.group?null:x.dataset.group;renderVirtues()});p.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>set(b.dataset.k,(+ent()[b.dataset.k]||0)+(+b.dataset.change)));p.querySelectorAll('[data-val]').forEach(i=>{i.onchange=()=>set(i.dataset.val,i.value);i.oninput=()=>{i.value=i.value.replace(/\D/g,'').slice(0,4)}})}function shift(n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);date=iso(d);if(date>today)date=today;renderVirtues()}
function monthAgg(y,m){let days=new Date(y,m+1,0).getDate(),daily=[],lapses=0,minutes=0,logged=0,by={};groups.forEach(g=>by[g[0]]=0);for(let d=1;d<=days;d++){let e=DATA[`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`],l=0;if(e){logged++;groups.forEach(g=>{let n=total(g,e);by[g[0]]+=n;if(g[0]==='m')minutes+=n;else if(!['s'].includes(g[0]))l+=n});lapses+=l}daily.push(e?l:null)}return{days,logged,lapses,minutes,by,daily}}function renderTrends(){let y=+date.slice(0,4),m=+date.slice(5,7)-1,a=monthAgg(y,m),html=`<div class="row"><button class="ar" id="mp">‹</button><b>${new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="ar" id="mn">›</button></div><div class="cards"><div class="card"><b>${a.logged}/${a.days}</b><span>Days logged</span></div><div class="card"><b>${a.lapses}</b><span>Monthly lapses</span></div><div class="card"><b>${a.logged?(a.lapses/a.logged).toFixed(1):'—'}</b><span>Avg lapse/logged day</span></div><div class="card"><b>${a.minutes}</b><span>Minutes devoted</span></div></div><h2>Virtue totals</h2>`;let maxV=Math.max(1,...groups.filter(g=>g[0]!=='m').map(g=>a.by[g[0]]));groups.forEach(g=>{if(g[0]==='m')return;let n=a.by[g[0]];html+=`<div>${g[1]} <b style="float:right">${n}</b><div class="bar"><i style="width:${Math.min(100,n/maxV*100)}%"></i></div></div>`});html+='<h2>Minutes by practice</h2>';let mvals={};groups[6][2].forEach(c=>{let v=0;for(let d=1;d<=a.days;d++){let e=DATA[`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`];v+=e?.['m_'+c[0]]||0}mvals[c[0]]=v});let maxM=Math.max(1,...Object.values(mvals));groups[6][2].forEach(c=>{let v=mvals[c[0]];html+=`<div>${c[1]} <b style="float:right">${v}</b><div class="bar"><i style="width:${v/maxM*100}%"></i></div></div>`});html+='<h2>Daily lapse trend</h2><div class="chart>'+a.daily.map(v=>`<i class="${v===null?'empty':''}" style="height:${v===null?2:Math.max(3,v/Math.max(1,...a.daily.filter(x=>x!==null))*100)}%" title="${v??'No data'}"></i>`).join('')+'</div><p class="small">Grey bars mean no data for that date.</p>';document.querySelector('#trendPane').innerHTML=html;document.querySelector('#mp').onclick=()=>shiftMonth(-1);document.querySelector('#mn').onclick=()=>shiftMonth(1)}function shiftMonth(n){let d=new Date(date+'T12:00:00');d.setMonth(d.getMonth()+n);date=iso(d);if(date>today)date=today;renderTrends()}
function renderCalendar(){let d=new Date(date+'T12:00:00'),y=d.getFullYear(),m=d.getMonth(),start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let html=`<div class="row"><button class="ar" id="cp">‹</button><b>${d.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="ar" id="cn">›</button></div><div class="calgrid">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}${Array(start).fill('<span></span>').join('')}${Array.from({length:days},(_,i)=>{let day=i+1,dt=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;return `<button data-date="${dt}" class="${date===dt?'sel':''} ${DATA[dt]?'mark':''}" ${dt>today?'disabled':''}>${day}</button>`}).join('')}</div><p class="small">Yellow underline indicates a day with records.</p><button class="btn" id="goDate">Open selected date in Virtues</button>`;document.querySelector('#calendarPane').innerHTML=html;document.querySelector('#cp').onclick=()=>shiftMonth(-1);document.querySelector('#cn').onclick=()=>shiftMonth(1);document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{date=b.dataset.date;renderCalendar()});document.querySelector('#goDate').onclick=()=>{activeTab='Virtues';show()}}
function renderManage(){let pane=document.querySelector('#tabManage');pane.innerHTML='<h2>Manage tabs</h2><p class="small">Rename, reorder, or remove tabs. Virtues is required. You can add new tabs (custom tabs currently act as personal section placeholders).</p>'+tabset.map((t,i)=>`<div class="item"><input value="${esc(t)}" data-name="${i}"><button data-up="${i}" class="btn out">↑</button><button data-down="${i}" class="btn out">↓</button><button data-del="${i}" class="btn out">×</button></div>`).join('')+'<button class="btn" id="addTab">+ Add tab</button>';pane.querySelectorAll('[data-name]').forEach(i=>i.onchange=()=>{let old=tabset[+i.dataset.name],newName=i.value.trim();if(newName&&newName!=='Manage'){tabset[+i.dataset.name]=newName;activeTab=newName;show()}});pane.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));pane.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1));pane.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let idx=+b.dataset.del;if(tabset[idx]==='Virtues'){alert('Virtues tab cannot be removed.');return}tabset.splice(idx,1);activeTab='Virtues';show()});pane.querySelector('#addTab').onclick=()=>{let n=prompt('Tab name?');if(n&&n.trim()&&!tabset.includes(n.trim())){tabset.push(n.trim());activeTab=n.trim();show()}}}function move(i,n){let j=i+n;if(j<0||j>=tabset.length)return;[tabset[i],tabset[j]]=[tabset[j],tabset[i]];show()}
let timerMode='timer',preset=15*60,left=preset,elapsed=0,started=0,running=false,interval=null,lastBell=0;function fmt(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function renderTimer(){let p=document.querySelector('#timerPane');p.innerHTML=`<h2>Meditation timer</h2><div class="row"><button class="btn out" id="timerMode">Timer</button><button class="btn out" id="swMode">Stopwatch</button></div><div class="row" id="presets">${[15,20,30,45].map(m=>`<button class="btn out" data-min="${m}">${m}m</button>`).join('')}</div><div class="row"><label>Custom min <input id="custom" type="number" min="1" max="1440" value="${Math.floor(preset/60)}" class="date"></label><button class="btn out" id="set">Set</button></div><h1 style="text-align:center;font-family:monospace;font-size:3rem" id="clock">${fmt(timerMode==='timer'?left:elapsed)}</h1><div class="row"><button class="btn" id="start">${running?'Running':'Start'}</button><button class="btn out" id="pause">Pause</button><button class="btn out" id="reset">Reset</button><button class="btn out" id="stop">Stop & save</button></div><label class="row"><input type="checkbox" id="bell"> Gentle bell every 5 minutes</label><p class="small">Bell requires the page to remain active; background browsers may delay it.</p>`;p.querySelector('#timerMode').onclick=()=>{if(running)return;timerMode='timer';renderTimer()};p.querySelector('#swMode').onclick=()=>{if(running)return;timerMode='stopwatch';renderTimer()};p.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{preset=+b.dataset.min*60;left=preset;renderTimer()});p.querySelector('#set').onclick=()=>{let m=+p.querySelector('#custom').value;if(m>0&&m<=1440){preset=m*60;left=preset;renderTimer()}};p.querySelector('#start').onclick=startTimer;p.querySelector('#pause').onclick=pauseTimer;p.querySelector('#reset').onclick=resetTimer;p.querySelector('#stop').onclick=()=>{pauseTimer();finishTimer()}}
function startTimer(){if(running)return;running=true;started=Date.now()-(timerMode==='timer'?(preset-left)*1000:elapsed*1000);interval=setInterval(tick,250);document.querySelector('#start').textContent='Running'}function tick(){if(timerMode==='timer'){left=Math.max(0,Math.ceil((started+preset*1000-Date.now())/1000));let passed=preset-left;if(document.querySelector('#bell')?.checked&&passed>=300&&Math.floor(passed/300)>lastBell){lastBell=Math.floor(passed/300);bellSound()}if(left<=0){pauseTimer();document.querySelector('#clock').textContent=fmt(0);finishTimer();return}}else elapsed=Math.floor((Date.now()-started)/1000);document.querySelector('#clock').textContent=fmt(timerMode==='timer'?left:elapsed)}function pauseTimer(){if(!running)return;if(interval)clearInterval(interval);interval=null;running=false}function resetTimer(){pauseTimer();elapsed=0;left=preset;lastBell=0;document.querySelector('#clock').textContent=fmt(timerMode==='timer'?left:elapsed);document.querySelector('#start').textContent='Start'}function bellSound(){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+1);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+1)}catch{}}function finishTimer(){let mins=Math.floor((timerMode==='timer'?preset:elapsed)/60);if(mins<1){alert('Session under one minute, not logged.');return}let type=prompt(`Finished ${mins} minute(s). Choose: B for Bhajan, S for Simran. Cancel to discard.`,'S');if(type===null)return;type=type.trim().toLowerCase();let k=type==='b'||type==='bhajan'?'m_b':type==='s'||type==='simran'?'m_i':null;if(!k){alert('No save: choose B or S.');return}ent()[k]=(+ent()[k]||0)+mins;save();alert(`${mins} minute(s) added to ${k==='m_b'?'Bhajan':'Simran'} for ${date}.`);resetTimer()}
function exportCSV(month){let [y,m]=month.split('-').map(Number),dim=new Date(y,m,0).getDate(),head=['Date',...groups.flatMap(g=>g[2].map(c=>g[1]+' - '+c[1])),'Total lapses','Total minutes'],rows=[head];for(let d=1;d<=dim;d++){let day=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,e=DATA[day],vals=[];groups.forEach(g=>g[2].forEach(c=>vals.push(e?.[g[0]+'_'+c[0]]??'')));let lapse=0,min=0;groups.forEach(g=>{let n=total(g,e||{});if(g[0]==='m')min+=n;else if(g[0]!=='s')lapse+=n});rows.push([day,...vals,e?lapse:'',e?min:''])}download('idiary-'+month+'.csv','\ufeff'+rows.map(r=>r.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v}).join(',')).join('\r\n'),'text/csv')}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}document.querySelector('#backup').onclick=()=>download('idiary-backup-'+today+'.json',JSON.stringify({app:'idiary',v:1,entries:DATA},null,2),'application/json');document.querySelector('#restore').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let p=JSON.parse(reader.result);if(p.app!=='idiary'||!p.entries)throw 0;if(confirm('Restore backup data? Existing matching dates will be replaced; other days retained.')){Object.assign(DATA,p.entries);save();show()}}catch{alert('Invalid iDiary backup file.')}};reader.readAsText(f);e.target.value=''};renderTabs();show();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
